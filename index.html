<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Rooms</title>
<style>
:root{--acc:#3390ec;--bg:#fff;--hd:#fff;--chat:#d9e4ee;--mine:#eeffde;--other:#fff;--text:#0f1419;--muted:#7a8590;--line:#e6e9ed;--tick:#4fae4e;--sheet:#fff}
:root[data-t=dark]{--acc:#6ab3f3;--bg:#17212b;--hd:#17212b;--chat:#0e1621;--mine:#2b5278;--other:#182533;--text:#f5f5f5;--muted:#7f91a4;--line:#0e1621;--tick:#7fd47d;--sheet:#1f2c3a}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none}
.screen{display:none;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--bg)}
.screen.on{display:flex}
button{cursor:pointer;border:0;font-size:1rem;color:inherit;background:none}
input{font-size:1rem;border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;background:var(--bg);color:var(--text);outline:none}
input:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:13px;width:100%;font-weight:700}
.link{color:var(--acc);padding:10px;font-weight:600}
.err{color:#e5484d;font-size:.9rem;min-height:1.2em;text-align:center}
.err.ok{color:var(--tick)}
.flag{background:linear-gradient(#ce1126 33.4%,#fff 33.4% 66.6%,#000 66.6%);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);width:168px;height:112px;margin:0 auto;border-radius:6px}
.flag b{color:#007a3d;font-size:1.5rem}
#auth{justify-content:center;padding:24px;gap:14px;padding-top:calc(24px + env(safe-area-inset-top))}
#auth h1{text-align:center;font-size:2rem;direction:ltr}
#auth p.sub{text-align:center;color:var(--muted);margin-top:-8px}
#auth input{direction:ltr;text-align:left}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--hd);border-bottom:1px solid var(--line)}
.top h2{flex:1;font-size:1.1rem;direction:ltr;text-align:right}
.top .me{color:var(--muted);font-size:.85rem;direction:ltr}
.ic{font-size:1.25rem;padding:4px 6px;color:var(--muted)}
.search{display:flex;gap:8px;padding:8px 12px}
.search input{direction:ltr;text-align:left;border-radius:20px;padding:10px 16px;background:var(--chat);border-color:transparent}
.search button{background:var(--acc);color:#fff;border-radius:20px;padding:0 18px;font-weight:700}
#chats{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
.row:active{background:var(--chat)}
.av{width:52px;height:52px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;flex:none;text-transform:uppercase}
.row .t{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:10px}
.row .h{display:flex;justify-content:space-between;gap:8px}
.row .n{font-weight:700;direction:ltr}
.row .d{color:var(--muted);font-size:.78rem}
.row .l{color:var(--muted);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.empty{padding:48px 24px;text-align:center;color:var(--muted);line-height:1.9}
#chat .back{font-size:1.5rem;color:var(--acc);padding:0 4px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--chat)}
.m{max-width:80%;padding:6px 10px 4px;border-radius:14px;background:var(--other);align-self:flex-end;overflow-wrap:anywhere;line-height:1.5;border-bottom-left-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.08);cursor:pointer}
.m.mine{align-self:flex-start;background:var(--mine);border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.q{border-inline-start:3px solid var(--acc);padding:1px 8px;margin-bottom:4px;font-size:.85rem;background:rgba(51,144,236,.1);border-radius:4px}
.q b{display:block;color:var(--acc);direction:ltr;text-align:right}
.q span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m small{display:block;font-size:.7rem;color:var(--muted);text-align:left;direction:ltr;margin-top:1px}
.m small i{font-style:normal;margin-inline-start:3px}
.m small i.r{color:var(--tick)}
#bar{display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--hd);border-top:1px solid var(--line);font-size:.88rem}
#bar.on{display:flex}
#bar div{flex:1;min-width:0;border-inline-start:3px solid var(--acc);padding:0 8px}
#bar b{display:block;color:var(--acc)}
#bar span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send{display:flex;gap:8px;align-items:center;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--hd);border-top:1px solid var(--line)}
.send input{border-radius:22px;padding:11px 16px}
.send button{background:var(--acc);color:#fff;border-radius:50%;width:44px;height:44px;font-size:1.1rem;flex:none}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet.on{display:flex}
#sheet div{background:var(--sheet);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
#sheet button{display:block;width:100%;text-align:start;padding:15px 22px}
#sheet button.del{color:#e5484d}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;display:none;z-index:10}
</style>
</head>
<body>

<div id="auth" class="screen">
  <div class="flag"><b>الله أكبر</b></div>
  <h1>Chat Rooms</h1>
  <p class="sub" id="sub">سجّل دخولك للتواصل</p>
  <input id="uname" placeholder="username (a-z, 0-9, _)" autocapitalize="none" style="display:none">
  <input id="email" type="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <div class="err" id="aerr"></div>
  <button class="btn" id="go">دخول</button>
  <button class="link" id="resend" style="display:none">إعادة إرسال رابط التأكيد</button>
  <button class="link" id="swap">ما عندك حساب؟ أنشئ حساب جديد</button>
</div>

<div id="list" class="screen">
  <div class="top">
    <h2>Chat Rooms</h2>
    <span class="me" id="me"></span>
    <button class="ic" id="theme" title="الثيم">☾</button>
    <button class="ic" id="out" title="خروج">⎋</button>
  </div>
  <div class="search">
    <input id="q" placeholder="@username" autocapitalize="none">
    <button id="find">ابحث</button>
  </div>
  <div id="chats"></div>
</div>

<div id="chat" class="screen">
  <div class="top">
    <button class="back" id="back">→</button>
    <div class="av" id="cav" style="width:40px;height:40px;font-size:1rem"></div>
    <h2 id="ctitle"></h2>
  </div>
  <div id="msgs"></div>
  <div id="bar"><div><b id="bt"></b><span id="bs"></span></div><button class="ic" id="bx">✕</button></div>
  <div class="send">
    <input id="txt" placeholder="اكتب رسالة...">
    <button id="snd">➤</button>
  </div>
</div>

<div id="sheet"><div id="sbox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDgSJbOY4MW0Ge9Qg0emCHlD0PmGl1IDuI",
  authDomain: "chat-rooms-427da.firebaseapp.com",
  projectId: "chat-rooms-427da",
  storageBucket: "chat-rooms-427da.firebasestorage.app",
  messagingSenderId: "443493401556",
  appId: "1:443493401556:web:902a85be1e9498df45cc41"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), TS = firebase.firestore.FieldValue.serverTimestamp;
const $ = id => document.getElementById(id);
let me = null, signup = false, busy = false, unList = null, unMsgs = null, cur = null, rep = null, edt = null;

/* theme */
const setTheme = t => { document.documentElement.dataset.t = t; $('theme').textContent = t === 'dark' ? '☀' : '☾'; try { localStorage.setItem('t', t); } catch (e) {} };
let t0 = null; try { t0 = localStorage.getItem('t'); } catch (e) {}
setTheme(t0 || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('theme').onclick = () => setTheme(document.documentElement.dataset.t === 'dark' ? 'light' : 'dark');

const COLS = ['#e17076', '#7bc862', '#e5ca77', '#65aadd', '#a695e7', '#ee7aae', '#6ec9cb', '#faa774'];
const col = n => COLS[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % COLS.length];
const avatar = (el, n) => { el.textContent = n[0] || '?'; el.style.background = col(n); };
const hm = ts => ts ? ts.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

const show = n => ['auth', 'list', 'chat'].forEach(s => $(s).classList.toggle('on', s === n));
const toast = t => { const e = $('toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2400); };
const ERR = {
  'auth/invalid-email': 'الايميل غير صحيح',
  'auth/email-already-in-use': 'هذا الايميل مسجّل مسبقًا',
  'auth/weak-password': 'كلمة المرور ضعيفة (6 أحرف على الأقل)',
  'auth/invalid-credential': 'الايميل أو كلمة المرور خطأ',
  'auth/wrong-password': 'الايميل أو كلمة المرور خطأ',
  'auth/user-not-found': 'الايميل أو كلمة المرور خطأ',
  'auth/network-request-failed': 'لا يوجد اتصال بالانترنت',
  'auth/too-many-requests': 'محاولات كثيرة، انتظر قليلًا ثم جرّب'
};
const aerr = (t, ok) => { $('aerr').textContent = t || ''; $('aerr').classList.toggle('ok', !!ok); $('resend').style.display = 'none'; };

function setMode(v) {
  signup = v;
  $('uname').style.display = signup ? '' : 'none';
  $('go').textContent = signup ? 'إنشاء حساب' : 'دخول';
  $('sub').textContent = signup ? 'اختر يوزرنيم ليجدك الناس به' : 'سجّل دخولك للتواصل';
  $('swap').textContent = signup ? 'عندي حساب؟ سجّل دخول' : 'ما عندك حساب؟ أنشئ حساب جديد';
  aerr();
}
$('swap').onclick = () => setMode(!signup);

const NOTVER = 'الايميل غير مؤكَّد. افتح رابط التأكيد المرسل لإيميلك (شيّك مجلد Spam) ثم سجّل دخول.';
$('resend').onclick = async () => {
  if (busy) return;
  const email = $('email').value.trim(), pass = $('pass').value;
  busy = true;
  try {
    const c = await auth.signInWithEmailAndPassword(email, pass);
    if (!c.user.emailVerified) await c.user.sendEmailVerification();
    await auth.signOut();
    busy = false;
    aerr('تم إرسال رابط التأكيد مرة ثانية إلى ' + email, true);
  } catch (e) { busy = false; aerr(ERR[e.code] || 'حدث خطأ: ' + e.code); }
};

$('go').onclick = async () => {
  if (busy) return;
  const email = $('email').value.trim(), pass = $('pass').value, uname = $('uname').value.trim().toLowerCase();
  aerr(); busy = true;
  try {
    if (signup) {
      if (!/^[a-z0-9_]{4,20}$/.test(uname)) { aerr('اليوزرنيم: من 4 إلى 20 حرف انجليزي أو رقم أو _'); busy = false; return; }
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      try {
        await db.runTransaction(async t => {
          const ref = db.doc('usernames/' + uname);
          if ((await t.get(ref)).exists) throw new Error('taken');
          t.set(ref, { uid: cred.user.uid });
          t.set(db.doc('users/' + cred.user.uid), { username: uname });
        });
      } catch (e) {
        await cred.user.delete();
        aerr(e.message === 'taken' ? 'اليوزرنيم مأخوذ، جرّب غيره' : 'تعذّر حفظ الحساب، جرّب مرة ثانية');
        busy = false; return;
      }
      try { await cred.user.sendEmailVerification(); } catch (e) {}
      await auth.signOut();
      busy = false; setMode(false);
      aerr('تم إرسال رابط التأكيد إلى ' + email + '. افتحه (شيّك مجلد Spam) ثم سجّل دخول.', true);
      return;
    } else {
      const c = await auth.signInWithEmailAndPassword(email, pass);
      if (!c.user.emailVerified) {
        await auth.signOut();
        busy = false; aerr(NOTVER); $('resend').style.display = '';
        return;
      }
      busy = false; enter(c.user);
    }
  } catch (e) { busy = false; aerr(ERR[e.code] || 'حدث خطأ: ' + e.code); }
};

auth.onAuthStateChanged(u => { if (busy) return; if (u && !u.emailVerified) { auth.signOut(); return; } u ? enter(u) : (cleanup(), show('auth')); });

async function enter(u) {
  unList && unList(); unMsgs && unMsgs(); unList = unMsgs = null;
  const d = await db.doc('users/' + u.uid).get();
  if (!d.exists) { await auth.signOut(); return; }
  me = { uid: u.uid, username: d.data().username };
  $('me').textContent = '@' + me.username;
  show('list');
  unList = db.collection('chats').where('members', 'array-contains', me.uid).onSnapshot(s => {
    const rows = s.docs.map(x => ({ id: x.id, ...x.data() }))
      .sort((a, b) => ((b.updatedAt && b.updatedAt.toMillis()) || 9e15) - ((a.updatedAt && a.updatedAt.toMillis()) || 9e15));
    const box = $('chats'); box.innerHTML = '';
    if (!rows.length) { box.innerHTML = '<div class="empty">ما عندك محادثات بعد.<br>ابحث عن صديقك باليوزرنيم بالأعلى وابدأ الدردشة.</div>'; return; }
    rows.forEach(r => {
      const other = r.members.find(x => x !== me.uid), name = (r.names && r.names[other]) || '?';
      const el = document.createElement('div'); el.className = 'row';
      el.innerHTML = '<div class="av"></div><div class="t"><div class="h"><div class="n"></div><div class="d"></div></div><div class="l"></div></div>';
      avatar(el.querySelector('.av'), name);
      el.querySelector('.n').textContent = name;
      el.querySelector('.d').textContent = hm(r.updatedAt);
      el.querySelector('.l').textContent = r.lastMessage || '';
      el.onclick = () => openChat(other, name);
      box.appendChild(el);
    });
  });
}

function cleanup() { unList && unList(); unMsgs && unMsgs(); unList = unMsgs = null; me = null; cur = null; }
$('out').onclick = () => auth.signOut();

async function find() {
  const name = $('q').value.trim().replace(/^@/, '').toLowerCase();
  if (!name) return;
  if (name === me.username) return toast('هذا حسابك أنت');
  try {
    const d = await db.doc('usernames/' + name).get();
    if (!d.exists) return toast('ما لقينا مستخدم بهذا اليوزرنيم');
    $('q').value = ''; openChat(d.data().uid, name);
  } catch (e) { toast('تعذّر البحث، تأكد من الانترنت'); }
}
$('find').onclick = find;
$('q').onkeydown = e => { if (e.key === 'Enter') find(); };

/* composer bar (reply / edit) */
function setBar(kind, title, text) {
  $('bar').classList.toggle('on', !!kind);
  $('bt').textContent = title || ''; $('bs').textContent = text || '';
}
function clearBar() { rep = edt = null; setBar(null); }
$('bx').onclick = () => { if (edt) $('txt').value = ''; clearBar(); };

/* message actions */
function menu(id, m) {
  const mine = m.from === me.uid, box = $('sbox'); box.innerHTML = '';
  const add = (label, fn, cls) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = () => { $('sheet').classList.remove('on'); fn(); }; box.appendChild(b); };
  add('↩ رد', () => { edt = null; rep = { id, text: m.text.slice(0, 80), name: m.from === me.uid ? me.username : cur.name }; setBar('r', 'رد على ' + rep.name, rep.text); $('txt').focus(); });
  add('⧉ نسخ', () => { navigator.clipboard && navigator.clipboard.writeText(m.text).then(() => toast('تم النسخ'), () => {}); });
  if (mine) {
    add('✎ تعديل', () => { rep = null; edt = id; $('txt').value = m.text; setBar('e', 'تعديل الرسالة', m.text.slice(0, 80)); $('txt').focus(); });
    add('🗑 حذف', async () => { try { await db.doc('chats/' + cur.id + '/messages/' + id).delete(); } catch (e) { toast('تعذّر الحذف'); } }, 'del');
  }
  add('إلغاء', () => {});
  $('sheet').classList.add('on');
}
$('sheet').onclick = e => { if (e.target.id === 'sheet') $('sheet').classList.remove('on'); };

function openChat(uid, name) {
  cur = { id: [me.uid, uid].sort().join('_'), uid, name };
  clearBar(); $('txt').value = '';
  $('ctitle').textContent = name; avatar($('cav'), name);
  $('msgs').innerHTML = ''; show('chat');
  unMsgs && unMsgs();
  unMsgs = db.collection('chats/' + cur.id + '/messages').orderBy('createdAt').onSnapshot(s => {
    const box = $('msgs'), nearEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    box.innerHTML = '';
    const unread = [];
    s.docs.forEach(x => {
      const m = x.data(), mine = m.from === me.uid, el = document.createElement('div');
      el.className = 'm' + (mine ? ' mine' : '');
      if (!mine && !m.read) unread.push(x.ref);
      if (m.replyTo) {
        const q = document.createElement('div'); q.className = 'q';
        const b = document.createElement('b'), sp = document.createElement('span');
        b.textContent = m.replyTo.name; sp.textContent = m.replyTo.text; q.append(b, sp); el.appendChild(q);
      }
      const p = document.createElement('span'); p.textContent = m.text;
      const t = document.createElement('small');
      t.textContent = (m.edited ? 'معدّلة ' : '') + (m.createdAt ? hm(m.createdAt) : '...');
      if (mine) { const k = document.createElement('i'); k.textContent = m.read ? '✓✓' : '✓'; if (m.read) k.className = 'r'; t.appendChild(k); }
      el.append(p, t);
      el.onclick = () => menu(x.id, m);
      box.appendChild(el);
    });
    if (nearEnd || !box.dataset.init) { box.scrollTop = box.scrollHeight; box.dataset.init = 1; }
    if (unread.length) { const b = db.batch(); unread.forEach(r => b.update(r, { read: true })); b.commit().catch(() => {}); }
  }, () => toast('تعذّر تحميل الرسائل'));
}
$('back').onclick = () => { unMsgs && unMsgs(); unMsgs = null; $('msgs').dataset.init = ''; show('list'); };

async function send() {
  const text = $('txt').value.trim();
  if (!text || !cur) return;
  $('txt').value = '';
  try {
    if (edt) {
      const id = edt; clearBar();
      await db.doc('chats/' + cur.id + '/messages/' + id).update({ text, edited: true });
      return;
    }
    const msg = { text, from: me.uid, createdAt: TS(), read: false };
    if (rep) msg.replyTo = { text: rep.text, name: rep.name };
    clearBar();
    await db.doc('chats/' + cur.id).set({
      members: [me.uid, cur.uid],
      names: { [me.uid]: me.username, [cur.uid]: cur.name },
      lastMessage: text, updatedAt: TS()
    }, { merge: true });
    await db.collection('chats/' + cur.id + '/messages').add(msg);
  } catch (e) { toast('تعذّر الإرسال'); }
}
$('snd').onclick = send;
$('txt').onkeydown = e => { if (e.key === 'Enter') send(); };
</script>
</body>
</html>
